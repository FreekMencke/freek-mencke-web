<!doctype html>
<html class="scroll-pt-bar-phone motion-safe:scroll-smooth sm:scroll-pt-bar" lang="en">
  <head>
    <base href="/" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f5f7" />

    <!-- The page's title and meta come from its route (PageMetaStrategy) -->
    <title>Freek Mencke</title>

    <!-- The theme before the first paint: the visitor's choice, else the system's. ThemeStore keeps it in sync. -->
    <script>
      {
        let theme = null;
        try {
          theme = localStorage.getItem('theme');
        } catch {
          // The browser blocks site data: follow the system
        }
        const dark = theme ? theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
        // The page's ground (base.css), as ThemeStore sets it on toggle
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0b1613' : '#f4f5f7');
      }
    </script>

    <link href="/favicon.png" rel="icon" media="(prefers-color-scheme: light)" />
    <link href="/favicon-dark.png" rel="icon" media="(prefers-color-scheme: dark)" />

    <link rel="preload" href="/fonts/SOLIX-Variable.woff2?v=3.01-100" as="font" type="font/woff2" crossorigin />
  </head>
  <body class="font-sans antialiased bg-ground text-ink">
    <app-root></app-root>
  </body>
</html>
