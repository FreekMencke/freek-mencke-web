name: CI

on:
  push:
    branches: ['main']
    # Deploy commits (and reverting them to roll back) only change the manifest, which Flux applies by itself, so they
    # need no CI run, and with no CI run there's no deploy run to skip
    paths-ignore: ['freek-mencke-web.yaml']
  pull_request:
    branches: ['main']

# Read-only unless a job asks for more: build and test run code from every installed package, so they get a token that
# can't push or approve pull requests, whatever the repository's default is
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
      - run: npm run lint
      - run: npm run prettier:ci
      # Unused files, exports and dependencies; what it can't see is in knip.jsonc
      - run: npx knip
      # The workflows' scripts and Claude Code's hooks. ShellCheck comes with GitHub's Ubuntu runners.
      - run: shellcheck .github/scripts/*.sh .claude/hooks/*.sh

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
      - run: npm run build

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
      - run: npm run test
