# GitHub Actions, the Docker base image and npm get version updates.
# Every version update waits 7 days after a release (cooldown), so a compromised release is usually pulled before we take
# it. Dependabot never applies a cooldown to security updates.
version: 2

updates:
  # Third-party actions are pinned to commit SHAs: Dependabot moves the SHA and its version comment together. `/` covers
  # only the workflows, not the composite actions.
  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  # The base image is pinned by digest, so this opens a PR when node:26-alpine is rebuilt (Node patches, Alpine fixes)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Node majors also need CI's setup-node bumped: do them by hand
      - dependency-name: node
        update-types: [version-update:semver-major]

  # One grouped PR a month for npm's minor and patch updates. Majors stay by hand: Angular's need `ng update` for its
  # migrations. When an update moves a package with an install script, `npm install-scripts ls` lists it: re-approve it
  # in that PR by hand (SKILL.md, Commit and push).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    commit-message:
      prefix: chore
      include: scope
